[project]
name = "enterprise-ai-qa-agent-server"
version = "0.1.0"
description = "FastAPI + LangGraph scaffold for an enterprise AI QA agent platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "deepagents==0.7.13",
  "langchain==1.4.6",
  "langchain-core==1.6.10",
  "langchain-openai==1.6.2",
  "langchain-anthropic==1.7.1",
  "langchain-google-genai==4.4.0",
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2",
  "langsmith==0.12.2",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "dependency-injector>=4.49.1",
  "httpx>=0.27.0",
  "openai>=1.60.0",
  "anthropic>=0.40.0",
  "google-genai>=1.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool==3.3.1",
  "neo4j>=5.24.0",
  "pymysql>=1.1.1",
  "boto3>=1.35.0",
  "redis>=5.0.0",
  "mcp>=1.10.0,<2.0.0",
  "cryptography>=41.0.0",
  "openpyxl>=3.1.0",
  "python-docx==1.2.0",
  "pypdf==6.19.0",
  "python-magic>=0.4.27",
  "playwright>=1.49.1",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.4.0",
  "alembic>=1.20.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
