[project]
name = "enterprise-ai-qa-agent-server"
version = "0.1.0"
description = "FastAPI + LangGraph scaffold for an enterprise AI QA agent platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langgraph>=0.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "openai>=1.60.0",
  "anthropic>=0.40.0",
  "google-genai>=1.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "neo4j>=5.24.0",
  "pymysql>=1.1.1",
  "minio>=7.2.0",
  "redis>=5.0.0",
  "mcp>=1.10.0,<2.0.0",
  "cryptography>=41.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
